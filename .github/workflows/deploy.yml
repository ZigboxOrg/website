name: Deploy zigbox.org
# Builds the whole of zigbox.org and deploys it to a Cloudflare Worker with static assets
# (wrangler.jsonc). GitHub Pages no longer serves the domain.
#
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (Account: Workers Scripts Edit; Zone
# zigbox.org: Workers Routes Edit and DNS Edit) and CLOUDFLARE_ACCOUNT_ID.
#
# Layout:
#   /                 src/ in this repo
#   /errors/box/      Zigbox's generated error pages (site/errors on ZigboxOrg/zigbox's main)
#   /errors/cube/     Zigcube's generated error pages (site/errors on ZigboxOrg/zigcube's main)
#   /zigbox/          Zigbox's project site (site/ on ZigboxOrg/zigbox's main)
#   /zigcube/         Zigcube's project site (site/ on ZigboxOrg/zigcube's main)
#   /apt/, /rpm/      the owner-signed apt and dnf repositories, with
#   /zigbox-archive-keyring.gpg and .asc: the zigbox-repos.tar.gz asset of the newest Zigbox
#                     release that has one, copied byte for byte (never built or signed here)
#   /deploy-stamp.txt what this deploy was built from (see the gate below)
# A pull request assembles the site and checks the Worker config; only main deploys, and then
# checks that zigbox.org serves every repository file and the stamp with status 200 and the
# exact bytes.
#
# Nothing in Zigbox calls this workflow: its release and its weekly package refresh upload a new
# zigbox-repos.tar.gz and then wait for zigbox.org to serve it. So the schedule runs every 15
# minutes, and a scheduled run deploys only when the stamp it computes differs from the one
# zigbox.org serves, or zigbox.org's signed package files differ from the live stamp's hashes.
# A push to main, workflow_dispatch or repository_dispatch always deploys; only main deploys.
# No run moves the packages to an older release, or to none, than the live stamp's tag (AGENTS.md).
# The logic is .github/deploy.sh and .github/pick-release.jq.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      allow_older_packages:
        description: >-
          Deploy the newest release with packages even when it is older than the tag zigbox.org
          serves (only when that tag's release was deleted or unpublished)
        type: boolean
        default: false
  repository_dispatch:
    types: [site]
  schedule:
    - cron: "7,22,37,52 * * * *"
    # Monthly: the keepalive below. GitHub disables a public repository's schedules after 60
    # days without activity.
    - cron: "41 3 1 * *"
permissions:
  contents: read
concurrency:
  group: deploy-${{ github.ref }}
  # A run on main is never cancelled half way through a deploy or its check; a newer one waits.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Only main deploys; any other ref assembles the site and dry-runs the Worker config.
      PRODUCTION: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: self
          persist-credentials: false
      # The stamp names everything the site is built from: this repository's commit, the main
      # commits of ZigboxOrg/zigbox and ZigboxOrg/zigcube, the packages release's tag and the
      # sha256 of its zigbox-repos.tar.gz, and (added by the next step) the sha256 of each
      # signed package file. Later steps build from exactly these commits and this asset.
      - name: Compute the deploy stamp
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SELF_SHA: ${{ github.sha }}
          HAVE_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          ALLOW_OLDER: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_older_packages }}
        run: |
          self/.github/pick-release-test.sh
          self/.github/deploy.sh gate
      - name: Fetch and check the signed package repositories
        id: pkg
        if: steps.gate.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.gate.outputs.tag }}
          ASSET_ID: ${{ steps.gate.outputs.asset_id }}
          SUM: ${{ steps.gate.outputs.sum }}
        run: self/.github/deploy.sh packages
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pkg.outputs.go == 'true'
        with:
          repository: ZigboxOrg/zigbox
          ref: ${{ steps.gate.outputs.box }}
          path: box
          sparse-checkout: site
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pkg.outputs.go == 'true'
        with:
          repository: ZigboxOrg/zigcube
          ref: ${{ steps.gate.outputs.cube }}
          path: cube
          sparse-checkout: site
          persist-credentials: false
      - name: Assemble the site
        if: steps.pkg.outputs.go == 'true'
        run: |
          set -eu
          out=self/_site
          mkdir -p "$out/errors/box" "$out/errors/cube" "$out/zigbox" "$out/zigcube"
          cp -R self/src/. "$out/"
          cp box/site/errors/*.html "$out/errors/box/"
          cp cube/site/errors/*.html "$out/errors/cube/"
          cp -R box/site/. "$out/zigbox/"
          cp -R cube/site/. "$out/zigcube/"
          find "$out" -name '.*' -type f -delete
          if [ -d pkg/tree ]; then
            for p in apt rpm zigbox-archive-keyring.gpg zigbox-archive-keyring.asc; do
              test ! -e "$out/$p" || { echo "not deployed: $p exists in src/ and in the packages"; exit 1; }
            done
            cp -R pkg/tree/. "$out/"
          fi
          test ! -e "$out/deploy-stamp.txt" || { echo "not deployed: deploy-stamp.txt exists in src/"; exit 1; }
          cp stamp.txt "$out/deploy-stamp.txt"
          echo "box:  $(find "$out/errors/box" -type f | wc -l) error pages and the project site, Zigbox $(git -C box rev-parse --short HEAD)"
          echo "cube: $(find "$out/errors/cube" -type f | wc -l) error pages and the project site, Zigcube $(git -C cube rev-parse --short HEAD)"
          for f in index.html errors/index.html errors/box/E0101.html errors/cube/E0101.html \
            zigbox/index.html zigcube/index.html zigcube/architecture.html; do
            test -s "$out/$f" || { echo "not deployed: $f is missing from the assembled site"; exit 1; }
          done
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.pkg.outputs.go == 'true'
        with:
          node-version: 22
      - name: Check the Worker config
        if: steps.pkg.outputs.go == 'true'
        working-directory: self
        run: npx --yes wrangler@4.151.3 deploy --dry-run
      - name: Deploy
        if: steps.pkg.outputs.go == 'true' && env.PRODUCTION == 'true'
        working-directory: self
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "not deployed: the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are not set"
            exit 1
          fi
          npx --yes wrangler@4.151.3 deploy
      - name: Check zigbox.org serves the package repositories and the stamp unchanged
        if: steps.pkg.outputs.go == 'true' && env.PRODUCTION == 'true'
        run: self/.github/deploy.sh check
  # Keeps the schedule alive: GitHub disables a public repository's scheduled workflows after 60
  # days without activity, and Zigbox's release and refresh wait on this schedule. If it was
  # disabled anyway: `gh workflow enable deploy.yml -R ZigboxOrg/website`, then
  # `gh workflow run deploy.yml -R ZigboxOrg/website` (AGENTS.md).
  keepalive:
    if: github.event_name == 'schedule' && github.event.schedule == '41 3 1 * *'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/enable"
          echo "keepalive: deploy.yml enabled"
